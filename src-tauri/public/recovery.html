<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>智账 · 重新连接账本</title>
  <style>
    :root { color-scheme: light; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 14px; color: #303536; background: #f4f4f0;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; user-select: none;
    }
    .card {
      background: #fff; border: 1px solid #e6e7e2; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.05);
      max-width: 520px; width: 100%; padding: 30px 32px 26px;
    }
    .eyebrow { font-size: 12px; letter-spacing: .08em; color: #936c36; margin-bottom: 8px; }
    h1 { font-size: 19px; margin-bottom: 10px; }
    p.desc { color: #747a7c; line-height: 1.65; margin-bottom: 14px; }
    .path {
      background: #fafaf7; border: 1px solid #e6e7e2; border-radius: 8px;
      padding: 10px 12px; font-family: Consolas, monospace; font-size: 12.5px;
      color: #303536; word-break: break-all; margin-bottom: 6px;
    }
    .reason { color: #a05656; font-size: 12.5px; margin-bottom: 18px; }
    .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
    button {
      font: inherit; text-align: left; padding: 11px 14px;
      border: 1px solid #e6e7e2; border-radius: 10px; background: #fff; cursor: pointer;
    }
    button:hover { border-color: #9b783f; }
    button.primary { background: #9b783f; border-color: #9b783f; color: #fff; text-align: center; }
    button.primary:hover { background: #84632e; }
    button.primary:disabled { opacity: .6; cursor: default; }
    .danger-zone { margin-top: 20px; padding-top: 16px; border-top: 1px dashed #e6e7e2; }
    .danger-zone summary { color: #747a7c; cursor: pointer; font-size: 13px; }
    .danger-note {
      margin: 10px 0; padding: 10px 12px; border-radius: 8px;
      background: #fbf3f2; border: 1px solid #eac8c4; color: #8c3d37; font-size: 13px; line-height: 1.6;
    }
    .footnote { margin-top: 16px; font-size: 12px; color: #a0a6a4; line-height: 1.6; }
    #status { margin-top: 12px; font-size: 13px; color: #747a7c; min-height: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">智账 · PathOrbit AI Ledger</div>
    <h1 id="title">找不到你的账本位置</h1>
    <p class="desc">智账不会在没有找到你原来账本的情况下创建新的空账本。你的数据还在原来的位置。</p>
    <div class="path" id="last-root">—</div>
    <div class="reason" id="reason"></div>
    <div class="actions">
      <button class="primary" id="btn-retry">重新尝试</button>
      <button id="btn-choose">选择账本位置…</button>
      <button id="btn-open">打开文件夹</button>
    </div>
    <details class="danger-zone">
      <summary>原位置已不可恢复？</summary>
      <div class="danger-note">创建新的空账本<b>不会恢复原来的数据</b>。原账本可能因磁盘未接入、目录被移动或权限变化而暂时不可用，建议先确认存储设备与路径。</div>
      <button id="btn-fresh">选择位置并创建新的空账本</button>
    </details>
    <div id="status"></div>
    <p class="footnote">提示：如果上次使用了可移动磁盘或网络位置，请先接通后再「重新尝试」。</p>
  </div>
  <script src="recovery.js"></script>
</body>
</html>
